[project]
name = "krea-2-oss"
version = "0.1.0"
description = "Minimal inference code for the Krea 2 (K2) diffusion model"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.11.0+cu126 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.12.0 ; sys_platform != 'linux' and sys_platform != 'win32'",
    "transformers==4.57.1",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
    "einops>=0.7.0",
    "diffusers>=0.32.0",
    "click>=8.4.1",
    "accelerate>=0.34.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
